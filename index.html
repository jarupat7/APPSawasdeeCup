<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>CourtCam - อัดคลิปพร้อมสกอร์ SAWASDEE CUP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #090E17;
      --panel: #131E2E;
      --border: #23354C;
      --text: #F1F5F9;
      --muted: #94A3B8;
      --accent: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --rec: #EF4444;
      --team-a: #10B981;
      --team-b: #3B82F6;
      --gold: #F59E0B;
      --font-display: 'Chakra Petch', sans-serif;
      --font-body: 'IBM Plex Sans Thai', sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.4;
      padding: 10px 12px 30px;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 6px;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-title span { color: var(--accent); }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent);
    }

    .live-badge.error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.3);
      color: #F87171;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
    }
    .live-badge.error .pulse-dot { background: #F87171; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Match Info Card */
    .match-info-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .court-select-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .court-select-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      flex: 1;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      background: #090E17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid var(--accent);
    }

    .match-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.88rem;
    }

    .match-teams {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .team-line {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
    }

    .team-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .team-pill.a { background: var(--team-a); color: #04271F; }
    .team-pill.b { background: var(--team-b); color: #081B38; }

    .team-name-text {
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.88rem;
      flex: 1;
    }

    .team-score-tag {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 800;
      padding: 1px 10px;
      border-radius: 6px;
      min-width: 40px;
      text-align: center;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    .team-score-tag.a {
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.55);
      color: #34D399;
    }
    .team-score-tag.b {
      background: rgba(59, 130, 246, 0.22);
      border: 1px solid rgba(59, 130, 246, 0.55);
      color: #60A5FA;
    }

    .match-score-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090E17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 12px;
      min-width: 80px;
      flex-shrink: 0;
    }

    .score-digits {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .score-status-sub {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* Video & Canvas Stage */
    .stage {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: aspect-ratio 0.25s ease;
      width: 100%;
    }

    .stage.vertical {
      aspect-ratio: 9 / 16;
      max-height: 65vh;
    }

    canvas#out {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      padding: 1.5rem;
      color: var(--muted);
      background: #090E17;
      z-index: 2;
    }

    .empty-state strong {
      color: var(--text);
      font-size: 1.1rem;
    }

    /* Recording Badge */
    .rec-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.7);
      padding: 5px 12px;
      border-radius: 20px;
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 700;
      z-index: 3;
    }
    .rec-badge.show { display: inline-flex; }
    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rec);
      animation: pulse 1s infinite;
    }

    /* Action Buttons */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 8px;
    }

    button {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 48px;
      transition: all 0.12s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-camera {
      background: #1E293B;
      border-color: #334155;
    }

    .btn-record {
      background: var(--rec);
      color: #FFF;
      border-color: var(--rec);
      font-family: var(--font-display);
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 12px rgba(239, 68, 68, 0.35);
    }
    .btn-record.recording {
      background: #7F1D1D;
      border-color: #DC2626;
      animation: recordGlow 1.5s infinite;
    }

    @keyframes recordGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 22px rgba(239, 68, 68, 0.85); }
    }

    .btn-toggle-ratio {
      background: #1E293B;
      border-color: #334155;
      font-size: 0.88rem;
    }

    /* Download notice */
    .save-alert {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
      font-weight: 600;
      color: #A7F3D0;
      font-size: 0.9rem;
    }

    video#raw { display: none; }
  </style>
</head>

  let currentCourt = 'C01';
  let isLandscape = true;
  let cameraStream = null;
  let videoDevices = [];

  // Active match data
  let matchData = {
    court: 'C01',
    matchId: '1',
    category: '',
    teamA: 'รอข้อมูลนักกีฬา A',
    teamB: 'รอข้อมูลนักกีฬา B',

  };

  const canvas = document.getElementById('out');

  const video = document.getElementById('raw');
  const stageWrap = document.getElementById('stageWrap');
  const logoImg = new Image();
  logoImg.src = LOGO_SRC;

  // Clean sets string from date auto-conversions
  function cleanSetsString(str) {
    if (!str) return '';
    const s = String(str).trim();
    if (s.includes('GMT') || s.includes('เวลา') || s.includes('00:00:00') || /^[A-Za-z]{3}\s+[A-Za-z]{3}/.test(s)) {
      return '';
    }
    if (!/^[0-9\s,\-]+$/.test(s)) {
      return '';
    }
    return s;
  }

  // Populate Courts
  function initCourtList() {
    const sel = document.getElementById('courtSelect');
    sel.innerHTML = '';
    const courts = [];
    for (let i = 1; i <= 30; i++) courts.push('C' + String(i).padStart(2, '0'));
    courts.push('VIP01', 'VIP02');

    const urlParams = new URLSearchParams(window.location.search);
    const paramCourt = urlParams.get('court');
    if (paramCourt) {
      const match = courts.find(c => c.toLowerCase() === paramCourt.toLowerCase() || c.replace(/^C0?/, '') === paramCourt.replace(/^C0?/, ''));
      if (match) currentCourt = match;
    }

    courts.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = 'สนาม ' + c;
      if (c === currentCourt) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function changeCourt(newCourt) {
    currentCourt = newCourt;
    fetchLiveSchedule();
  }

  // --- Automatic Fast Data Fetching ---
  async function fetchLiveSchedule() {
    const badge = document.getElementById('syncBadge');
    const badgeText = document.getElementById('syncStatusText');

    try {
      // 1. Primary: Fast Single Court API (Super Lightweight ~0.3 KB, Instant response)
      const fastUrl = GAS_URL + '?view=court&court=' + encodeURIComponent(currentCourt) + '&day=DAY1';
      const res = await fetch(fastUrl, { redirect: 'follow' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      if (data && data.success && data.match) {
        applySingleMatch(data.match);
        badge.className = 'live-badge';
        badgeText.textContent = 'ดึงข้อมูลสดสำเร็จ (' + currentCourt + ')';
        return;
      } else if (Array.isArray(data) && data.length > 0) {
        applyMatchFromSchedule(data);
        badge.className = 'live-badge';
        badgeText.textContent = 'ดึงข้อมูลสดสำเร็จ (' + data.length + ' แมตช์)';
        return;
      }
    } catch (errGas) {
      console.warn('Fast fetch fallback:', errGas);
      // Fallback 1: Full schedule from GAS
      try {
        const resFull = await fetch(GAS_URL + '?view=schedule&day=DAY1', { redirect: 'follow' });
        if (resFull.ok) {
          const matches = await resFull.json();
          if (Array.isArray(matches) && matches.length > 0) {
            applyMatchFromSchedule(matches);
            badge.className = 'live-badge';
            badgeText.textContent = 'ดึงข้อมูลสดสำเร็จ (สำรอง)';
            return;
          }
        }
      } catch (eFull) {}

      // Fallback 2: Local Server API
      try {
        const resLocal = await fetch('/api/cam-feed?court=' + encodeURIComponent(currentCourt) + '&_=' + Date.now());
        if (resLocal.ok) {
          const localData = await resLocal.json();
          if (localData && localData.a) {
            matchData.teamA = localData.a;
            matchData.teamB = localData.b;
            matchData.scoreA = localData.pa || 0;
            matchData.scoreB = localData.pb || 0;
            matchData.matchId = localData.match_nr || '-';
            matchData.category = localData.round || '';
            updateUI();
            badge.className = 'live-badge';
            badgeText.textContent = 'ซิงค์จากระบบท้องถิ่น';
            return;
          }
        }
      } catch (e) {}

      badge.className = 'live-badge error';
      badgeText.textContent = 'กำลังรอเชื่อมต่อระบบ...';
    }
  }

  function applySingleMatch(m) {
    if (!m) return;
    matchData.court = m.court || currentCourt;
    matchData.matchId = m.match_id || '-';
    matchData.category = (m.level ? m.level + ' ' : '') + (m.round || '');
    matchData.teamA = m.team_a || 'รอผู้แข่งขัน A';
    matchData.teamB = m.team_b || 'รอผู้แข่งขัน B';

    let sa = Number(m.score_a) || 0;
    let sb = Number(m.score_b) || 0;
    const cleanSets = cleanSetsString(m.raw_sets_display);
    if (cleanSets && cleanSets.includes('-')) {
      const setsArr = cleanSets.split(',').map(s => s.trim());
      const lastSet = setsArr[setsArr.length - 1];
      const pts = lastSet.split('-').map(x => parseInt(x.trim(), 10));
      if (pts.length === 2 && !isNaN(pts[0]) && !isNaN(pts[1])) {
        sa = pts[0];
        sb = pts[1];
      }
    }
    matchData.scoreA = sa;
    matchData.scoreB = sb;
    matchData.status = (m.status || 'PENDING').toUpperCase();
    matchData.rawSets = cleanSets;
    updateUI();
  }

  function applyMatchFromSchedule(matches) {
    const norm = (s) => (s || '').toUpperCase().replace(/^C0?/, '').trim();
    const target = norm(currentCourt);

    const courtMatches = matches.filter(m => norm(m.court) === target);

    if (courtMatches.length > 0) {
      let m = courtMatches.find(x => x.status === 'playing' || x.tv_route === 'NO1');
      if (!m) m = courtMatches.find(x => x.status === 'standby' || x.tv_route === 'NO2');
      if (!m) m = courtMatches.find(x => x.status !== 'done');
      if (!m) m = courtMatches[courtMatches.length - 1];

      if (m) applySingleMatch(m);
    }
  }

  function updateUI() {
    document.getElementById('teamAName').textContent = matchData.teamA;
    document.getElementById('teamBName').textContent = matchData.teamB;
    document.getElementById('teamAScoreTag').textContent = matchData.scoreA;
    document.getElementById('teamBScoreTag').textContent = matchData.scoreB;
    document.getElementById('scoreText').textContent = matchData.scoreA + ' - ' + matchData.scoreB;
    document.getElementById('matchSubText').textContent = 'แมตช์ #' + matchData.matchId + ' · ' + matchData.status;
  }

  // --- Camera Management ---
  async function toggleCamera() {
    const btn = document.getElementById('btnCam');
    const empty = document.getElementById('emptyState');

    if (cameraStream) {
      if (videoDevices.length > 1) {
        currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
        await startStream(videoDevices[currentDeviceIndex].deviceId);
        return;
      } else {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
        video.srcObject = null;
        btn.textContent = '📷 เปิดกล้อง';
        empty.style.display = 'flex';
        document.getElementById('btnRec').disabled = true;
        return;
      }
    }

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(d => d.kind === 'videoinput');
      const preferred = videoDevices.find(d => /back|rear|environment/i.test(d.label)) || videoDevices[0];
      const deviceId = preferred ? preferred.deviceId : undefined;
      await startStream(deviceId);
      empty.style.display = 'none';
      document.getElementById('btnRec').disabled = false;
      btn.textContent = videoDevices.length > 1 ? '🔄 สลับกล้อง' : '⏹️ ปิดกล้อง';
    } catch (err) {
      alert('ไม่สามารถเข้าถึงกล้องได้: ' + err.message + '\n(โปรดอนุญาตสิทธิ์กล้องในเบราว์เซอร์)');
    }
  }

  async function startStream(deviceId) {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
    }

    const constraints = {
      audio: true,
      video: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        facingMode: deviceId ? undefined : { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    };

    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = cameraStream;
    await video.play();
    requestAnimationFrame(renderLoop);
  }

  function toggleRatio() {
    isLandscape = !isLandscape;
    const btn = document.getElementById('btnRatio');
    if (isLandscape) {
      canvas.width = 1280;
      canvas.height = 720;
      stageWrap.className = 'stage';
      btn.textContent = '📱 แนวนอน';
    } else {
      canvas.width = 720;
      canvas.height = 1280;
      stageWrap.className = 'stage vertical';
      btn.textContent = '📱 แนวตั้ง';
    }
  }

  // --- Render Loop (NO DISTORTION / PRESERVES ASPECT RATIO) ---
  function renderLoop() {
    if (!cameraStream) return;

    const w = canvas.width;
    const h = canvas.height;

    // 1. Calculate proper object-fit: cover coordinates to prevent any distortion / stretching
    const vw = video.videoWidth || 1280;
    const vh = video.videoHeight || 720;
    const vRatio = vw / vh;
    const cRatio = w / h;

    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (vRatio > cRatio) {
      // Video is wider than canvas -> crop left/right
      sw = vh * cRatio;
      sx = (vw - sw) / 2;
    } else {
      // Video is taller than canvas -> crop top/bottom
      sh = vw / cRatio;
      sy = (vh - sh) / 2;
    }

    // Draw pristine, proportional video frame
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);

    // 2. Top Header Bar
    const isLand = isLandscape;
    const topBarH = isLand ? 56 : 74;
    const gradTop = ctx.createLinearGradient(0, 0, 0, topBarH + 20);
    gradTop.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
    gradTop.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradTop;
    ctx.fillRect(0, 0, w, topBarH + 20);

    const logoSize = isLand ? 40 : 50;
    const logoX = 16;
    const logoY = 10;
    if (logoImg.complete && logoImg.naturalWidth > 0) {
      ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
    }

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold ' + (isLand ? '16px' : '20px') + ' "Chakra Petch", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SAWASDEE CUP 2026', logoX + logoSize + 10, logoY + (isLand ? 18 : 24));

    ctx.fillStyle = '#10B981';
    ctx.font = '600 ' + (isLand ? '12px' : '15px') + ' "IBM Plex Sans Thai", sans-serif';
    ctx.fillText('สนาม ' + matchData.court + ' · แมตช์ #' + matchData.matchId, logoX + logoSize + 10, logoY + (isLand ? 34 : 44));

    if (matchData.category) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      const catText = matchData.category;
      ctx.font = 'bold ' + (isLand ? '13px' : '16px') + ' "Chakra Petch", sans-serif';
      const catW = ctx.measureText(catText).width + 20;
      const catX = w - catW - 16;
      const catY = logoY + 4;
      ctx.beginPath();
      ctx.roundRect(catX, catY, catW, isLand ? 28 : 34, 6);
      ctx.fill();

      ctx.fillStyle = '#F1F5F9';
      ctx.textAlign = 'center';
      ctx.fillText(catText, catX + catW / 2, catY + (isLand ? 19 : 23));
    }

    // 3. Bottom Broadcast Scoreboard (2-Row BWF Style with score behind each name)
    const rowH = isLand ? 38 : 46;
    const gap = 3;
    const totalH = rowH * 2 + gap;
    const barW = isLand ? Math.min(840, w - 36) : (w - 24);
    const barX = (w - barW) / 2;
    const barY = h - totalH - (isLand ? 16 : 22);

    const scoreBoxW = isLand ? 60 : 70;
    const nameMaxW = barW - scoreBoxW - 55;

    // --- Row 1: Team A ---
    const rowAY = barY;
    ctx.fillStyle = 'rgba(9, 14, 23, 0.92)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(barX, rowAY, barW, rowH, [6, 6, 2, 2]);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#10B981';
    ctx.fillRect(barX, rowAY, 5, rowH);

    ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
    ctx.beginPath();
    ctx.roundRect(barX + 10, rowAY + (rowH - (isLand ? 20 : 24)) / 2, isLand ? 20 : 24, isLand ? 20 : 24, 4);
    ctx.fill();
    ctx.fillStyle = '#10B981';
    ctx.font = 'bold ' + (isLand ? '11px' : '13px') + ' "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('A', barX + 10 + (isLand ? 10 : 12), rowAY + rowH / 2 + (isLand ? 4 : 5));

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold ' + (isLand ? '16px' : '19px') + ' "IBM Plex Sans Thai", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(truncate(matchData.teamA, nameMaxW), barX + (isLand ? 36 : 42), rowAY + rowH / 2 + (isLand ? 5 : 6));

    const scoreAX = barX + barW - scoreBoxW - 3;
    ctx.fillStyle = 'rgba(16, 185, 129, 0.15)';
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
    ctx.beginPath();
    ctx.roundRect(scoreAX, rowAY + 3, scoreBoxW, rowH - 6, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.font = '800 ' + (isLand ? '22px' : '26px') + ' "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(matchData.scoreA), scoreAX + scoreBoxW / 2, rowAY + rowH / 2 + (isLand ? 7 : 8));

    // --- Row 2: Team B ---
    const rowBY = barY + rowH + gap;
    ctx.fillStyle = 'rgba(9, 14, 23, 0.92)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(barX, rowBY, barW, rowH, [2, 2, 6, 6]);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#3B82F6';
    ctx.fillRect(barX, rowBY, 5, rowH);

    ctx.fillStyle = 'rgba(59, 130, 246, 0.25)';
    ctx.beginPath();
    ctx.roundRect(barX + 10, rowBY + (rowH - (isLand ? 20 : 24)) / 2, isLand ? 20 : 24, isLand ? 20 : 24, 4);
    ctx.fill();
    ctx.fillStyle = '#60A5FA';
    ctx.font = 'bold ' + (isLand ? '11px' : '13px') + ' "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('B', barX + 10 + (isLand ? 10 : 12), rowBY + rowH / 2 + (isLand ? 4 : 5));

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold ' + (isLand ? '16px' : '19px') + ' "IBM Plex Sans Thai", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(truncate(matchData.teamB, nameMaxW), barX + (isLand ? 36 : 42), rowBY + rowH / 2 + (isLand ? 5 : 6));

    const scoreBX = barX + barW - scoreBoxW - 3;
    ctx.fillStyle = 'rgba(59, 130, 246, 0.15)';
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
    ctx.beginPath();
    ctx.roundRect(scoreBX, rowBY + 3, scoreBoxW, rowH - 6, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.font = '800 ' + (isLand ? '22px' : '26px') + ' "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(matchData.scoreB), scoreBX + scoreBoxW / 2, rowBY + rowH / 2 + (isLand ? 7 : 8));

    requestAnimationFrame(renderLoop);
  }

  function truncate(str, maxW) {
    if (!str) return '';
    let curr = str;
    while (ctx.measureText(curr).width > maxW && curr.length > 3) {
      curr = curr.slice(0, -2);
    }
    return curr === str ? str : curr + '...';
  }

  // --- Recording System ---
  function toggleRecord() {
    const btn = document.getElementById('btnRec');
    const badge = document.getElementById('recBadge');
    const alertBox = document.getElementById('saveAlert');

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      clearInterval(recordTimerId);
      btn.className = 'btn-record';
      btn.textContent = '● อัดคลิป';
      badge.className = 'rec-badge';
      alertBox.style.display = 'block';
      setTimeout(() => { alertBox.style.display = 'none'; }, 6000);
      return;
    }

    recordedChunks = [];
    const canvasStream = canvas.captureStream(30);

    if (cameraStream && cameraStream.getAudioTracks().length > 0) {
      canvasStream.addTrack(cameraStream.getAudioTracks()[0]);
    }

    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus'
      : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');

    mediaRecorder = new MediaRecorder(canvasStream, { mimeType: mime, videoBitsPerSecond: 4000000 });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      a.href = url;
      a.download = 'SAWASDEE_' + matchData.court + '_Match' + matchData.matchId + '_' + Date.now() + '.' + ext;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
    };

    mediaRecorder.start(1000);
    recordStartTime = Date.now();
    btn.className = 'btn-record recording';
    btn.textContent = '⏹️ หยุดบันทึก';
    badge.className = 'rec-badge show';

    recordTimerId = setInterval(() => {
      const sec = Math.floor((Date.now() - recordStartTime) / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      document.getElementById('recTimer').textContent = 'REC ' + m + ':' + s;
    }, 500);
  }

  // --- Smart Adaptive Auto-Refresh ---
  let refreshTimerId = null;
  function scheduleNextFetch() {
    clearTimeout(refreshTimerId);
    if (document.hidden) {
      // พักการดึงข้อมูลเมื่อพับหน้าจอหรือจอดับ เพื่อประหยัดแบตเตอรี่และโควต้า
      return;
    }
    // ดึงไวขึ้น (3 วิ) เมื่อเปิดกล้อง หรือ 6 วิเมื่อยังไม่เปิดกล้อง
    const delay = cameraStream ? 3000 : 6000;
    refreshTimerId = setTimeout(async () => {
      await fetchLiveSchedule();
      scheduleNextFetch();
    }, delay);
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      fetchLiveSchedule();
      scheduleNextFetch();
    } else {
      clearTimeout(refreshTimerId);
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    initCourtList();
    fetchLiveSchedule();
    scheduleNextFetch();
  });
</script>
